<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="margin:0;background:#0b1020;">
  <audio id="remoteAudio" autoplay></audio>
  <script src="https://cdn.jsdelivr.net/npm/sip.js@0.21.2/dist/sip.min.js"></script>
  <script>
    var ua, registerer, currentSession;

    function status(s) {
      try { if (window.Android && Android.onStatus) Android.onStatus(s); } catch (e) {}
    }

    function attachAudio(session) {
      try {
        var pc = session.sessionDescriptionHandler.peerConnection;
        var ms = new MediaStream();
        pc.getReceivers().forEach(function (r) { if (r.track) ms.addTrack(r.track); });
        document.getElementById("remoteAudio").srcObject = ms;
      } catch (e) { status("audioerr"); }
    }

    function wireSession(session) {
      currentSession = session;
      session.stateChange.addListener(function (s) {
        if (s === SIP.SessionState.Established) { attachAudio(session); status("connected"); }
        if (s === SIP.SessionState.Terminated) { status("ended"); }
      });
    }

    // Called from Android once mic permission is granted.
    function appRegister(ext, pass, wss, domain) {
      try {
        ua = new SIP.UserAgent({
          uri: SIP.UserAgent.makeURI("sip:" + ext + "@" + domain),
          transportOptions: { server: wss },
          authorizationUsername: ext,
          authorizationPassword: pass,
          sessionDescriptionHandlerFactoryOptions: {
            peerConnectionConfiguration: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] },
          },
          delegate: {
            onInvite: function (invitation) {
              status("ringing");
              invitation.accept({ sessionDescriptionHandlerOptions: { constraints: { audio: true, video: false } } });
              wireSession(invitation);
            },
          },
        });
        ua.start().then(function () {
          registerer = new SIP.Registerer(ua);
          registerer.stateChange.addListener(function (s) {
            if (s === SIP.RegistererState.Registered) status("registered");
          });
          return registerer.register();
        }).catch(function (e) { status("regerr"); });
      } catch (e) { status("err"); }
    }

    function appHangup() {
      try {
        if (currentSession) {
          if (currentSession.state === SIP.SessionState.Established || currentSession.state === SIP.SessionState.Establishing) {
            if (currentSession.bye) currentSession.bye();
          } else if (currentSession.reject) {
            currentSession.reject();
          }
        }
        if (registerer) registerer.unregister();
        if (ua) ua.stop();
      } catch (e) {}
    }
  </script>
</body>
</html>
