# Merging is deploying.
#
# Edge functions were the one part of this system that only shipped if somebody
# remembered to run a command on their own laptop — so they routinely sat
# undeployed for hours after the code that needed them had merged, and the app
# ran against a version of the backend nobody was looking at. Twice that turned
# into "the report is still the old one" with no clue in the repo as to why.
#
# Deploys ALL functions, not just the changed ones. A one-line edit to
# _shared/pulse.ts changes the behaviour of team-pulse, pulse-broadcast and
# founder-alerts, and a path filter clever enough to work that out is a thing
# that will be wrong one day. Deploying everything takes a couple of minutes and
# is always right.
#
# Reads supabase/config.toml, which is what keeps verify_jwt = false on the
# seventeen webhooks and cron targets that need it. Do not deploy without it.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/tests/**"
      - ".github/workflows/supabase-deploy.yml"
  # Manual re-run. NOTE: this repo's default branch is NOT main, and GitHub only
  # offers workflow_dispatch from the default branch — so if the button is
  # missing, that is why, and a push to main is the reliable trigger.
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail with a sentence a human can act on. Without this the CLI exits on
      # an authentication error that reads like the project is misconfigured.
      - name: Check the access token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at" \
                 "https://supabase.com/dashboard/account/tokens and add it under" \
                 "Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      # supabase/functions is a deploy root, not a source folder. Every file
      # under it is a candidate for the bundle, and one stray test file took
      # the Daily Pulse, the founder alerts and team-pulse down for an hour —
      # BOOT_ERROR on all three, with source code that was provably correct.
      # Tests live in supabase/tests/.
      - name: Nothing but functions under supabase/functions
        run: |
          stray=$(find supabase/functions \( -name '*.test.*' -o -name '__tests__' -o -name '*.mjs' \) -print)
          if [ -n "$stray" ]; then
            echo "::error::Not an edge function, but sitting in the deploy root:"
            echo "$stray"
            echo "::error::Move it to supabase/tests/. Files here are bundled into every function that shares the folder."
            exit 1
          fi

      # A duplicate top-level declaration is a SyntaxError, so the module never
      # loads and every function importing it answers BOOT_ERROR. It is also
      # invisible to every check that does not actually parse the file — this
      # exact mistake shipped once, and the source "looked fine" in a diff, in a
      # byte-comparison against main, and in a unit test that regex-matched the
      # first copy.
      # THIS CHECK SILENTLY DID NOTHING FOR ITS ENTIRE LIFE.
      #
      # It ran `npx --yes typescript@5.6.3 tsc`, and npm answers that with
      # "could not determine executable to run" — the package is `typescript`,
      # the binary is `tsc`, and npx cannot infer one from the other. tsc never
      # started, /tmp/tsc.txt came out empty, grep found nothing, and the step
      # went green. A guard written specifically to stop another BOOT_ERROR
      # outage was itself a no-op, which is worse than having no guard at all:
      # the green tick was evidence of nothing and everyone read it as evidence
      # of something.
      #
      # Fixed with --package (which tells npx where the binary comes from), and
      # then made unable to lie again: the step now proves tsc actually ran
      # before it is allowed to pass.
      - name: Type-check the shared modules
        run: |
          set -o pipefail
          npx --yes --package typescript@5.6.3 tsc --noEmit --skipLibCheck --allowJs \
            --target es2022 --module esnext --moduleResolution bundler \
            --noResolve supabase/functions/_shared/*.ts 2>&1 | tee /tmp/tsc.txt || true

          # Liveness: a real run always prints the jsr:/Deno resolution errors
          # these files cannot avoid under --noResolve. Silence means the
          # compiler did not run, and silence must never be read as "clean".
          if ! grep -q "error TS" /tmp/tsc.txt; then
            echo "::error::The shared-module type-check produced NO compiler output — tsc did not run. Refusing to treat that as a pass."
            cat /tmp/tsc.txt
            exit 1
          fi

          if grep -qE "TS2451|TS2393|TS1005|TS1128|TS2300" /tmp/tsc.txt; then
            echo "::error::Duplicate declaration or syntax error in supabase/functions/_shared — this WILL boot-error every function that imports it:"
            grep -E "TS2451|TS2393|TS1005|TS1128|TS2300" /tmp/tsc.txt
            exit 1
          fi

      # THE GUARD TESTS ACTUALLY RUN NOW.
      #
      # supabase/tests/money-guard.test.mjs was written after a founder was told
      # a customer had paid when nobody had. It was never wired into a workflow,
      # so it never ran once — and two days later the same class of bug shipped
      # again, this time telling a founder a customer had visited the site when
      # he had not turned up. A test nobody runs is a comment.
      #
      # It replaces that file (the guard it reached into was renamed when the
      # visit and invented-detail checks joined it) and blocks the deploy.
      - name: Guard tests — the Pulse must not invent money or visits
        run: node supabase/tests/pulse-grounding.test.mjs

      # Pinned, not "latest". Resolving "latest" costs an unauthenticated call
      # to the GitHub releases API, and that is exactly what failed the deploy
      # of 471447c: "Failed to resolve latest Supabase CLI release: rate limit
      # exceeded". A deploy that skips because a version lookup was throttled is
      # a deploy that silently did not happen.
      #
      # 2.111.0 verified against the npm registry (the CLI publishes the same
      # version to npm and to its GitHub releases). Bump deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref rqgkzamuohdvttnkluzn

      # A green deploy is not a working deploy. These three all deployed
      # "successfully" while failing to boot, and nothing noticed until a
      # founder reported the Pulse was down an hour later. OPTIONS is the
      # cheapest possible liveness probe: it returns before any auth or body
      # handling, so a non-2xx here means the module did not load at all.
      - name: Smoke-test the functions that carry a message
        if: success()
        run: |
          fail=0
          for fn in pulse-broadcast founder-alerts team-pulse notify-provider notify-rep whatsapp-send; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X OPTIONS \
              "https://rqgkzamuohdvttnkluzn.supabase.co/functions/v1/$fn" --max-time 30 || echo 000)
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "  ok   $fn ($code)"
            else
              echo "::error::$fn did not boot — OPTIONS returned $code: $(head -c 200 /tmp/out)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "::error::Deploy completed but at least one function cannot start."; exit 1; }

      # Only on success. The first run of this workflow failed on the missing
      # token and then printed "Deployed every function…" underneath the error,
      # because this step was `if: always()`. A deploy log that claims success
      # after a failure is worse than no log at all — it is exactly how someone
      # concludes the functions are live when they are not.
      - name: What went out
        if: success()
        run: echo "Deployed every function in supabase/functions to rqgkzamuohdvttnkluzn."

      - name: What did not go out
        if: failure()
        run: echo "::warning::Deploy failed — the functions on Supabase are UNCHANGED, still running the previous version."
