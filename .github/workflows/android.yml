name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Monotonic version so the in-app updater can tell builds apart.
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SalesAutoCall-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Generate version manifest
        if: success() && github.ref == 'refs/heads/main'
        run: |
          # Generic, user-facing note only — never the commit/PR/branch text,
          # so the in-app "Update available" dialog can't leak repo internals.
          NOTES="New features, speed improvements and bug fixes."
          jq -n \
            --argjson vc ${{ github.run_number }} \
            --arg vn "1.0.${{ github.run_number }}" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/android-latest/app-debug.apk" \
            --arg notes "$NOTES" \
            '{versionCode: $vc, versionName: $vn, apkUrl: $url, notes: $notes}' > version.json
          cat version.json

      - name: Publish APK + manifest to "android-latest" release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Call Pro AI (latest build)
          body: |
            Latest build of the Call Pro AI salesperson app (v1.0.${{ github.run_number }}).
            The app updates itself in-app — reps only install manually once.
            First-time install: download `app-debug.apk` and open it
            (enable "Install unknown apps" if prompted).
          prerelease: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            version.json
