name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Monotonic version so each brand's in-app updater can tell builds apart.
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # One build produces every brand's debug APK (all share applicationId +
      # the committed debug keystore, so each installs cleanly over its own line).
      - name: Build debug APKs (all brand flavors)
        working-directory: android
        run: gradle assembleStandardDebug assembleSndeveloperDebug assembleManaspropertyDebug --stacktrace --no-daemon

      # Flatten every flavor's APK into one folder for a simple artifact/publish.
      - name: Collect APKs
        if: always()
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/*/debug/*.apk dist/ 2>/dev/null || true
          ls -la dist || true

      # Convenience download for branch builds only. Never allowed to fail the
      # pipeline: the repo's artifact quota filling up once blocked every APK
      # rollout. Publishing below goes straight to Releases, which don't count
      # against that quota.
      - name: Upload APK artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: brand-apks
          path: android/dist/*.apk
          if-no-files-found: ignore
          retention-days: 1

      # Each brand publishes to its OWN rolling release, so its app self-updates
      # only from its own line. Only on main. `standard` = Call Pro AI
      # (android-latest, asset app-debug.apk) — unchanged, so existing installs
      # keep updating. Published from THIS job (no artifact handoff) so a full
      # artifact quota can never block a rollout again.
      - name: Prepare release files
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          prep() { # flavor src asset tag
            mkdir -p "out-$1"
            cp "android/dist/$2" "out-$1/$3"
            # User-facing note only — never commit/PR/branch text.
            jq -n \
              --argjson vc ${{ github.run_number }} \
              --arg vn "1.0.${{ github.run_number }}" \
              --arg url "https://github.com/${{ github.repository }}/releases/download/$4/$3" \
              --arg notes "New features, speed improvements and bug fixes." \
              '{versionCode: $vc, versionName: $vn, apkUrl: $url, notes: $notes}' > "out-$1/version.json"
            cat "out-$1/version.json"
          }
          prep standard      app-standard-debug.apk      app-debug.apk              android-latest
          prep sndeveloper   app-sndeveloper-debug.apk   app-sndeveloper-debug.apk  android-sndeveloper
          prep manasproperty app-manasproperty-debug.apk app-manasproperty-debug.apk android-manasproperty

      - name: Publish Call Pro AI APK + manifest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Call Pro AI (latest build)
          body: |
            Latest build of the Call Pro AI app (v1.0.${{ github.run_number }}).
            The app updates itself in-app — reps only install manually once.
            First-time install: download the APK and open it
            (enable "Install unknown apps" if prompted).
          prerelease: true
          files: |
            out-standard/app-debug.apk
            out-standard/version.json

      - name: Publish SN Developer APK + manifest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-sndeveloper
          name: SN Developer (latest build)
          body: |
            Latest build of the SN Developer app (v1.0.${{ github.run_number }}).
            The app updates itself in-app — reps only install manually once.
            First-time install: download the APK and open it
            (enable "Install unknown apps" if prompted).
          prerelease: true
          files: |
            out-sndeveloper/app-sndeveloper-debug.apk
            out-sndeveloper/version.json

      - name: Publish Manas Property APK + manifest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-manasproperty
          name: Manas Property (latest build)
          body: |
            Latest build of the Manas Property app (v1.0.${{ github.run_number }}).
            The app updates itself in-app — reps only install manually once.
            First-time install: download the APK and open it
            (enable "Install unknown apps" if prompted).
          prerelease: true
          files: |
            out-manasproperty/app-manasproperty-debug.apk
            out-manasproperty/version.json
