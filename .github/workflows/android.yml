name: Build Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Monotonic version so each brand's in-app updater can tell builds apart.
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # One build produces every brand's debug APK (all share applicationId +
      # the committed debug keystore, so each installs cleanly over its own line).
      - name: Build debug APKs (all brand flavors)
        working-directory: android
        run: gradle assembleStandardDebug assembleSndeveloperDebug assembleManaspropertyDebug --stacktrace --no-daemon

      # Flatten every flavor's APK into one folder for a simple artifact/publish.
      - name: Collect APKs
        if: always()
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/*/debug/*.apk dist/ 2>/dev/null || true
          ls -la dist || true

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-apks
          path: android/dist/*.apk
          if-no-files-found: ignore

  # Each brand publishes to its OWN rolling release, so its app self-updates only
  # from its own line. Only on main. `standard` = Call Pro AI (android-latest,
  # asset app-debug.apk) — unchanged, so existing installs keep updating.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: standard
            brand: "Call Pro AI"
            tag: android-latest
            src: app-standard-debug.apk
            asset: app-debug.apk
          - flavor: sndeveloper
            brand: "SN Developer"
            tag: android-sndeveloper
            src: app-sndeveloper-debug.apk
            asset: app-sndeveloper-debug.apk
          - flavor: manasproperty
            brand: "Manas Property"
            tag: android-manasproperty
            src: app-manasproperty-debug.apk
            asset: app-manasproperty-debug.apk
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: brand-apks
          path: dist

      - name: Prepare release files
        run: |
          mkdir -p out
          cp "dist/${{ matrix.src }}" "out/${{ matrix.asset }}"
          # User-facing note only — never commit/PR/branch text.
          NOTES="New features, speed improvements and bug fixes."
          jq -n \
            --argjson vc ${{ github.run_number }} \
            --arg vn "1.0.${{ github.run_number }}" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/${{ matrix.tag }}/${{ matrix.asset }}" \
            --arg notes "$NOTES" \
            '{versionCode: $vc, versionName: $vn, apkUrl: $url, notes: $notes}' > out/version.json
          cat out/version.json

      - name: Publish ${{ matrix.brand }} APK + manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.brand }} (latest build)
          body: |
            Latest build of the ${{ matrix.brand }} app (v1.0.${{ github.run_number }}).
            The app updates itself in-app — reps only install manually once.
            First-time install: download the APK and open it
            (enable "Install unknown apps" if prompted).
          prerelease: true
          files: |
            out/${{ matrix.asset }}
            out/version.json
